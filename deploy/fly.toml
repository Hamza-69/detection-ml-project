# Fly.io config for the public CPU demo. Deploy from the repo root:
#   fly deploy . --config deploy/fly.toml --dockerfile deploy/Dockerfile --remote-only --ha=false
app = "acdc-cardiac-aub"
primary_region = "fra"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
